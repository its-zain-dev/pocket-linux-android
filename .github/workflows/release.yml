name: PocketLinux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v2.1.1)'
        required: true
        default: 'v2.1.1'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish PocketLinux APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install CI system dependencies
        run: |
          sudo apt-get update
          if apt-cache policy qemu-user-static 2>/dev/null | grep -qE 'Candidate: [0-9]'; then
            QEMU_PKGS="qemu-user-static binfmt-support"
          else
            QEMU_PKGS="qemu-user qemu-user-binfmt"
          fi
          sudo apt-get install -y --no-install-recommends \
            gawk binutils make python3 curl tar unzip gzip meson ninja-build pkg-config $QEMU_PKGS

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache NDK PRoot & VirGL binaries
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: ${{ runner.os }}-proot-virgl-v4-${{ hashFiles('scripts/ci/build-proot.sh', 'scripts/ci/build-virgl.sh') }}

      - name: Build PRoot & unbundled loader (arm64-v8a & x86_64)
        run: bash scripts/ci/build-proot.sh --skip-existing

      - name: Build VirGL GPU server (arm64-v8a & x86_64)
        run: bash scripts/ci/build-virgl.sh --skip-existing

      - name: Cache Alpine v3.20 rootfs tarballs
        uses: actions/cache@v4
        with:
          path: |
            app/src/arm64/assets/rootfs-arm64-v8a.tar.gz
            app/src/x86_64/assets/rootfs-x86_64.tar.gz
          key: ${{ runner.os }}-rootfs-v3.20-v4-${{ hashFiles('scripts/ci/build-rootfs.sh', 'scripts/ci/rootfs-overlay/**') }}

      - name: Build Alpine v3.20 rootfs tarballs (aarch64 & x86_64)
        run: bash scripts/ci/build-rootfs.sh --skip-existing

      - name: Run unit tests and assemble multi-ABI APKs
        run: |
          ./gradlew --no-daemon \
            testArm64DebugUnitTest \
            testX86_64DebugUnitTest \
            assembleArm64Debug \
            assembleX86_64Debug

      - name: Verify arm64 and x86_64 APKs
        run: |
          python3 scripts/ci/verify-apk.py \
            --apk app/build/outputs/apk/arm64/debug/app-arm64-debug.apk \
            --abi arm64-v8a \
            --max-size-mb 190
          python3 scripts/ci/verify-apk.py \
            --apk app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk \
            --abi x86_64 \
            --max-size-mb 190

      - name: Stage release assets and checksums
        run: |
          mkdir -p release-dist
          TAG="${{ steps.meta.outputs.tag }}"
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk "release-dist/PocketLinux-${TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk "release-dist/PocketLinux-${TAG}-x86_64.apk"
          (cd release-dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PocketLinux ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PocketLinux ${{ steps.meta.outputs.tag }}

            Self-contained, rootless **Alpine Linux 3.20** fullscreen desktop, Adreno/Mali hardware-accelerated VirGL GPU engine, standalone multi-stream Download Manager, movable Windows-style Desktop, and Windows-11-inspired Settings Center for Android — no root, no Termux, and no external VNC app required.

            ### What's New in ${{ steps.meta.outputs.tag }}
            - **Adreno 5xx/6xx/7xx & Mali VirGL 3D Crash Fix**: Rebuilt `libvirgl_test_server.so` with official Android EGL/GLES 3 patches (disables `feat_dual_src_blend` on Android, uses 1×1 Pbuffer context + safe `memfd`/`ashmem` SHM negotiation + live `virgl_server.log` diagnostics) — eliminates the 1-second black-screen crash in `glxgears` and 3D apps.
            - **Android Native Network & DNS Bridge (`127.0.0.1:18080`)**: Routes browser and package traffic cleanly through Android's native resolver whenever Private DNS/VPN/carrier blocks UDP 53, plus PRoot-safe sandbox flags for **Firefox ESR**, **Chromium**, and **Luakit**.
            - **Standalone Background Download Manager (`Downloads`) & Upgraded `PocketStore`**: Detached `pocketlinux-pkgd` daemon keeps downloads running in the background even after closing PocketStore, syncs live across multiple windows, accelerates downloads with parallel multi-stream fetching (0%–100% progress + live speed), lets you install multiple apps at once, and includes a working live Log Viewer in both Store and Downloads.
            - **Movable Windows-Style Desktop & Automatic App Sync**: Every app installed from PocketStore automatically appears on your **Desktop** (freely movable via drag-and-drop with snap-to-grid or free placement), **Start Menu → Installed Apps**, **File Manager → Applications**, and the Android **Apps & System** tab.
            - **Phone Storage Access + Privacy Mode Toggle**: Added proper Android storage permission grants so `/mnt/phone` shows your device files, PLUS a **Privacy Mode (`Hide Phone Files`)** toggle in both Android's floating menu and Linux Settings to make `/mnt/phone` appear completely empty on demand.
            - **Windows-11-Inspired Settings Center**: 8-section sidebar redesign with live Accent Colors, 4 built-in Wallpapers + custom image picker, customizable Taskbar position/size/clock/auto-hide, Desktop icon size & arrangement tools, DPI scaling, GPU diagnostics, Network Bridge control, and Privacy Mode.
            - **Upgraded Touch Controls & Clean Exit (`⏻ Exit & Stop`)**: Added touch double-tap snapping, **Drag Lock** chip for effortless window & desktop-icon dragging, optional floating **Quick Touch Bar**, real-cursor Right Click, plus clean full shutdown via the red **`⏻ Exit & Stop`** drawer button, the **`Exit & Stop`** notification action, or swiping PocketLinux away from Android Recents.

            ### Downloads
            - **Phones & Tablets (64-bit ARM)**: `PocketLinux-${{ steps.meta.outputs.tag }}-arm64-v8a.apk`
            - **x86_64 Emulators / Chromebooks**: `PocketLinux-${{ steps.meta.outputs.tag }}-x86_64.apk`
          files: |
            release-dist/PocketLinux-*-arm64-v8a.apk
            release-dist/PocketLinux-*-x86_64.apk
            release-dist/SHA256SUMS.txt

name: PocketLinux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build PRoot, VirGL, Alpine Rootfs & Multi-ABI APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install CI system dependencies
        run: |
          sudo apt-get update
          if apt-cache policy qemu-user-static 2>/dev/null | grep -qE 'Candidate: [0-9]'; then
            QEMU_PKGS="qemu-user-static binfmt-support"
          else
            QEMU_PKGS="qemu-user qemu-user-binfmt"
          fi
          sudo apt-get install -y --no-install-recommends \
            gawk binutils make python3 curl tar unzip gzip meson ninja-build pkg-config $QEMU_PKGS
          ls -la /proc/sys/fs/binfmt_misc/ || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache NDK PRoot & VirGL binaries
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: ${{ runner.os }}-proot-virgl-v2-${{ hashFiles('scripts/ci/build-proot.sh', 'scripts/ci/build-virgl.sh') }}

      - name: Build PRoot & unbundled loader (arm64-v8a & x86_64)
        run: bash scripts/ci/build-proot.sh --skip-existing

      - name: Build VirGL GPU server (optional, graceful fallback if NDK headers differ)
        continue-on-error: true
        run: bash scripts/ci/build-virgl.sh --skip-existing

      - name: Cache Alpine v3.20 rootfs tarballs
        uses: actions/cache@v4
        with:
          path: |
            app/src/arm64/assets/rootfs-arm64-v8a.tar.gz
            app/src/x86_64/assets/rootfs-x86_64.tar.gz
          key: ${{ runner.os }}-rootfs-v3.20-slim-${{ hashFiles('scripts/ci/build-rootfs.sh', 'scripts/ci/rootfs-overlay/**') }}

      - name: Build Alpine v3.20 rootfs tarballs (aarch64 & x86_64)
        run: bash scripts/ci/build-rootfs.sh --skip-existing

      - name: Smoke test rootfs tarballs via chroot & qemu-aarch64-static
        run: |
          set -euo pipefail

          smoke_check_rootfs() {
            local tar_path="$1"
            local use_qemu="$2"
            local stage="$RUNNER_TEMP/smoke-$use_qemu-$$"
            cleanup_stage() {
              if mountpoint -q "$stage/proc" 2>/dev/null; then
                sudo umount -l "$stage/proc" || true
              fi
              sudo rm -rf "$stage" || true
            }
            trap cleanup_stage RETURN

            mkdir -p "$stage"
            sudo tar -xzf "$tar_path" -C "$stage"
            if [[ "$use_qemu" == "aarch64" ]]; then
              if ! grep -qsE 'flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64 2>/dev/null; then
                QEMU_BIN="$(command -v qemu-aarch64-static || command -v qemu-aarch64)"
                sudo cp "$QEMU_BIN" "$stage${QEMU_BIN}"
                sudo chmod 0755 "$stage${QEMU_BIN}"
              fi
            fi
            sudo mount -t proc proc "$stage/proc"

            sudo chroot "$stage" /bin/sh -c '
              set -eu
              /bin/bash --version | head -n 1
              apk --version
              python3 --version
              python3 -c "import gi; gi.require_version(\"Gtk\", \"3.0\"); from gi.repository import Gtk; print(\"GTK3_PY_OK\")"
              file --version | head -n 1
              nano --version | head -n 1
              test -d /root/Desktop
              test -f /root/.config/gtk-3.0/bookmarks
              test -x /usr/local/bin/linux-health.sh
              test -x /usr/local/bin/pocketlinux-store.py
              test -x /usr/local/bin/pocketlinux-settings.py
              /usr/local/bin/linux-health.sh --smoke
              xvnc_out="$(Xvnc -help 2>&1 || true)"
              printf "%s\n" "$xvnc_out" | grep -qi "Xvnc"
              jwm_out="$(jwm -v 2>&1 || true)"
              printf "%s\n" "$jwm_out" | grep -qi "JWM"
              /usr/local/bin/sysinfo.sh
            '
          }

          smoke_check_rootfs "app/src/arm64/assets/rootfs-arm64-v8a.tar.gz" "aarch64"
          smoke_check_rootfs "app/src/x86_64/assets/rootfs-x86_64.tar.gz" "x86_64"

      - name: Run Gradle unit tests, lint, and assemble multi-ABI APKs
        run: |
          ./gradlew --no-daemon \
            testArm64DebugUnitTest \
            testX86_64DebugUnitTest \
            lintArm64Debug \
            lintX86_64Debug \
            assembleArm64Debug \
            assembleX86_64Debug

      - name: Verify arm64 and x86_64 APKs
        run: |
          python3 scripts/ci/verify-apk.py \
            --apk app/build/outputs/apk/arm64/debug/app-arm64-debug.apk \
            --abi arm64-v8a \
            --max-size-mb 175
          python3 scripts/ci/verify-apk.py \
            --apk app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk \
            --abi x86_64 \
            --max-size-mb 175

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketlinux-arm64-debug-apk
          path: app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketlinux-x86_64-debug-apk
          path: app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk
          if-no-files-found: error

      - name: Upload lint & test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: app/build/reports/
          if-no-files-found: ignore
